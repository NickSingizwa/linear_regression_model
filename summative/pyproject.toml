[project]
name = "life-expectancy-linear-regression"
version = "1.0.0"
description = "Multivariate linear regression to predict life expectancy from WHO health indicators (summative)."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.8.0",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "notebook>=7.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "httpx>=0.27",
]

[tool.uv]
package = false
